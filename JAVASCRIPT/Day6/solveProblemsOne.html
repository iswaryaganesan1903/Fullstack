    let array = ["Vijay", "Ajith", "Surya", "SK"]

    let movieCollection = [200, 500, 800, 400, 600]
    console.log('Movie collection =', movieCollection);

    for (let j = 1; j <= movieCollection.length - 1; j++) {
        if (highest < movieCollection[j]) {
            highest = movieCollection[j]
        }
    }
    console.log('Highest =', highest);

        }
    }
    console.log('Lowest =', lowest);

    }
    console.log('Total =', sum);



    console.log('Task-5:Create an array of movie collections-Find the average collection.');

    console.log('Average', avg);
