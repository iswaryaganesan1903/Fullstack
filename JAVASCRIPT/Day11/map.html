<script>
    console.log('Task 1-Convert all names to uppercase using map().');
    const heroes = ["Vijay", "Ajith", "Suriya"]
    const uppercase = heroes.map(heroes => heroes.toUpperCase())
    console.log(uppercase);


    console.log('Task 2-Multiply every collection by 10');
    const collections = [100, 200, 300, 400];
    const arrMult = collections.map(e => e * 10)
    console.log(arrMult);


    console.log('Task 3-Adding String');
    const movies = ["GOAT", "Leo", "Master"];
    const addMovie = movies.map(e => "Movies : " + e)
    console.log(addMovie);


    console.log('Task 18 - Display only student names.');
    const students = [

        {
            id: 1,
            name: "Sudhan"
        },

        {
            id: 2,
            name: "Rahul"
        }
    ];
    const displayName = students.map(e=>e.name)
    console.log('Display only student names : ',displayName);
    


</script>
