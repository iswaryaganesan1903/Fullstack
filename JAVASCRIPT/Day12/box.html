<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <h1 class="bg-yellow-100 p-5 mb-3 text-center text-lg"> Welcome </h1>
    <div class="bg-blue-500 m-2 p-2 h-100 w-100 hide">
        box
    </div>
    <button onclick="hide()">Click here</button>
</body>
<script>
    const myButton = document.querySelector(".hide")
    const hide = () => {
        if (myButton.style.display === "none") {
            myButton.style.display = "block";
        } else {
            myButton.style.display = "none";
        }
    }

</script>

</html>
