<script>
    console.log('Task-1  Find Missing Number');
    const arr = (array) => {
        for (let i = 1; i <= array.length + 1; i++) {
            if (i != array[i - 1]) {
                console.log(i);
                break;
            }
        }
    }
    arr([1, 2, 3, 5])


    console.log('Task-2   Find First Non-Repeated Character');
    const find = (str) => {
        let result = "";
        for (let i = 0; i < str.length; i++) {
            let count = 0;
            for (let j = 0; j < str.length; j++) {
                if (str[i] === str[j]) {
                    count++;
                }
            }
            if (count === 1) {
                result = str[i];
                break;
            }
        }
        console.log("First Non-Repeated Character:", result);
    }
    find("programming")


    console.log('Task-3  Find First Repeated Character');
    const repeat = (string) => {
        let result1 = "";
        for (let i = 0; i < string.length; i++) {
            for (let j = i + 1; j < string.length; j++) {
                if (string[i] === string[j]) {
                    result1 = string[i];
                    break;
                }
            }
            if (result1 !== "") {
                break;
            }
        }
        console.log("First Repeated Character:", result1);
    }
    repeat("javascript")


    console.log('Task-4  Move All Zeros To End');
    const zeroEnd = (arr) => {
        let result2 = [];
        let index = 0;

        for (let i = 0; i < arr.length; i++) {
            if (arr[i] !== 0) {
                result2[index] = arr[i];
                index++;
            }
        }

        for (let i = 0; i < arr.length; i++) {
            if (arr[i] === 0) {
                result2[index] = arr[i];
                index++;
            }
        }

        console.log(result2);
    }
    zeroEnd([1, 0, 2, 0, 3, 4, 0])


    console.log('Task-5  Count Occurrences');
    const occurences = (arr2) => {
        for (let i = 0; i < arr2.length; i++) {
            let count1 = 0;

            for (let j = 0; j < arr2.length; j++) {
                if (arr2[i] === arr2[j]) {
                    count1++;
                }
            }

            let alreadyCounted = false;

            for (let k = 0; k < i; k++) {
                if (arr2[i] === arr2[k]) {
                    alreadyCounted = true;
                    break;
                }
            }

            if (!alreadyCounted) {
                console.log(arr2[i], ":", count1);
            }
        }
    }
    occurences(["Vijay", "Ajith", "Vijay", "SK"])


    console.log('Task-6 Find Most Frequent Element');
    const frequent = (arr3) => {
        let maxCount = 0;
        let frequentElement;

        for (let i = 0; i < arr3.length; i++) {
            let count2 = 0;

            for (let j = 0; j < arr3.length; j++) {
                if (arr3[i] === arr3[j]) {
                    count2++;
                }
            }

            if (count2 > maxCount) {
                maxCount = count2;
                frequentElement = arr3[i];
            }
        }

        console.log("Most Frequent Element:", frequentElement);
        console.log("Count:", maxCount);
    }
    frequent([1, 2, 2, 3, 2, 4, 1])


    console.log('Task-7   Separate Even & Odd');
    const evenOdd = (numArray) => {
        let evenArray = []
        let oddArray = []
        let ind1 = 0
        let ind2 = 0
        for (i = 0; i < numArray.length; i++) {
            if (numArray[i] % 2 == 0) {
                evenArray[ind1] = numArray[i]
                ind1++
            }
            else {
                oddArray[ind2] = numArray[i]
                ind2++
            }
        }
        console.log('Even :', evenArray);
        console.log('Odd :', oddArray);

    }
    evenOdd([1, 2, 3, 4, 5, 6])


    console.log('Task-8  Rotate Array Left Once');
    const rotateLeft = (hero) => {
        let ans = [];

        for (let i = 1; i < hero.length; i++) {
            ans[i - 1] = hero[i];
        }

        ans[hero.length - 1] = hero[0];

        console.log(ans);
    }
    rotateLeft(["Vijay", "Ajith", "Suriya", "SK"])


    console.log('Task-9  Rotate Array Right Once');
    const rotateRight = (heros) => {
        let answer = [];
        answer[0] = heros[heros.length - 1];

        for (let i = 0; i < heros.length - 1; i++) {
            answer[i + 1] = heros[i];
        }

        console.log(answer);
    }
    rotateRight(["Vijay", "Ajith", "Suriya", "SK"])


    console.log('Task-10  Find Second Longest Namee');
    const secLong=(a)=>{
    let longest = "";
    let secondLongest = "";

    for (let i = 0; i < a.length; i++) {
        if (a[i].length > longest.length) {
            secondLongest = longest;
            longest = a[i];
        } else if (a[i].length > secondLongest.length) {
            secondLongest = a[i];
        }
    }

    console.log(secondLongest);
   }
   secLong(["Vijay","Ajith","Sivakarthikeyan","Dhanush"])
</script>
