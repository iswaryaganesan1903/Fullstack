<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Animation</title>
    <link rel="stylesheet" href="../assets/css/button.css">
</head>

<body>
    <div class="parent">
        <div class="form">
            <center>
                <h1>Student Login</h1>
            </center>
            <form class="login">

                <label>Name:</label>
                <input type="text" placeholder="Enter your Name" required>
                <br>

                <label>Password:</label>
                <input type="password" placeholder="Enter password" minlength="6" maxlength="12" required>
                <br>
                <div class="clear">
                    <button class="one">Login</button>
                    <button class="two">Clear</button>
                    
                </div>

            </form>
        </div>
    </div>

</body>

</html>
