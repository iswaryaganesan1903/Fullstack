<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="../assets/css/card.css">
</head>

<body>
    <div class="parent">
        <div class="parent-one">

            <div class="left">
                <h2>Thumbnail</h2>
                <img src="../assets/images/New folder/1.jpg" alt="">
            </div>
            <div class="right">
                <p><strong>Note: This image tile will be used to represent this course across all your academy's landing pages.
                </strong></p>
                <p>Allowed formats: ".jpg, .png, .jpeg, .gif, .webp, .sketch"</p>
                <p>Preferred minimum resolution: 480*270</p>
                <p>Maximum size: 150kb</p>
                <button>Change number</button>
                <button>Remove Image</button>
            </div>
        </div>

    </div>


</body>

</html>
