 Semantic Tags:

Semantic tags clearly describe the meaning of the content.

<header></header>      Header section
<nav></nav>            Navigation links
<main></main>          Main content
<section></section>    Section of content
<article></article>    Independent article/content
<aside></aside>        Sidebar content
<footer></footer>      Footer section
<figure></figure>      Image/diagram container
<figcaption></figcaption> Caption for figure
<details></details>    Expandable details
<summary></summary>    Heading for details
<mark></mark>          Highlighted text
<time></time>          Date/time
<address></address>    Contact information
<form></form>          Form section
<table></table>        Table data
Non-Semantic Tags:

Non-semantic tags do not describe the meaning of content.
They are mainly used for styling or grouping.

<div></div>        Generic container
<span></span>      Inline container
<b></b>            Bold text
<i></i>            Italic text
<u></u>            Underlined text
