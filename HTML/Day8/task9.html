<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Example</title>
</head>
<body>

    <center>

        <h1>Embedding YouTube Video and Google Map using iframe</h1>

        <!-- YouTube Video -->
        <h2>YouTube Video</h2>

        <iframe 
            width="700" 
            height="400"
            src="https://www.youtube.com/embed/xTC0-RqEyTk"
            frameborder="0"
            allowfullscreen>
        </iframe>

        <br><br>

        <!-- Google Map -->
        <h2>Google Map</h2>

        <iframe
            width="700"
            height="400"
            src="https://maps.google.com/maps?q=Saravana%20Stores%20Padi&t=&z=16&ie=UTF8&iwloc=&output=embed"
            frameborder="0"
            style="border:0;"
            allowfullscreen>
        </iframe>

    </center>

</body>
</html>
