<html>

<head>
    <title>College Admission Form</title>
</head>

<body>

    <h1>College Admission Form</h1>
    <div>
        <section>


            <form>


                <fieldset>
                    <legend><b>Personal Information</b></legend>

                    <label>Student Name:</label>
                    <input type="text" placeholder="Enter your name">
                    <br><br>

                    <label>Date of Birth:</label>
                    <input type="date">
                    <br><br>

                    <label>Gender:</label>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                    <br><br>

                    <label>Mobile Number:</label>
                    <input type="tel" placeholder="Enter mobile number">
                    <br><br>

                    <label>Email:</label>
                    <input type="email" placeholder="Enter your email">

                </fieldset>

                <br>


                <fieldset>
                    <legend><b>Course Details</b></legend>

                    <label>Select Department:</label>

                    <select>

                        <optgroup label="Engineering Departments">
                            <option>CSE</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>MECH</option>
                            <option>CIVIL</option>
                        </optgroup>

                        <optgroup label="Arts & Science Departments">
                            <option>BCA</option>
                            <option>B.Sc Computer Science</option>
                            <option>B.Com</option>
                            <option>BBA</option>
                            <option>BA English</option>
                        </optgroup>

                    </select>

                    <br>

                    <label>Select Year:</label>

                    <select>
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                    </select>

                </fieldset>

                <br>


                <fieldset>
                    <legend><b>Address Information</b></legend>

                    <label>Address:</label><br>
                    <textarea rows="5" cols="40"></textarea>

                    <br><br>

                    <label>City:</label>
                    <input type="text" placeholder="Enter city">

                    <br><br>

                    <label>State:</label>
                    <input type="text" placeholder="Enter state">

                </fieldset>

                <br>


                <fieldset>
                    <legend><b>Submit Form</b></legend>

                    <input type="submit" value="Apply Now">
                    <input type="reset" value="Clear Form">

                </fieldset>

            </form>
        </section>
    </div>

</body>

</html>
