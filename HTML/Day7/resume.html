<html>

<head>
    <title>Resume Builder Form</title>
</head>

<body>

    <h1>Resume Builder Form</h1>
    <div>
        <section>
            <form>


                <fieldset>
                    <legend><b>Personal Details</b></legend>

                    <label>Full Name:</label>
                    <input type="text" placeholder="Enter your full name" required>
                    <br><br>

                    <label>Email:</label>
                    <input type="email" placeholder="Enter your email" required>
                    <br><br>

                    <label>Mobile Number:</label>
                    <input type="tel" placeholder="Enter mobile number" required>
                    <br><br>

                    <label>Date of Birth:</label>
                    <input type="date">
                    <br><br>

                    <label>Gender:</label>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                    <br><br>

                    <label>Address:</label><br>
                    <textarea rows="4" cols="40"></textarea>

                </fieldset>

                <br>


                <fieldset>
                    <legend><b>Education Details</b></legend>

                    <label>College Name:</label>
                    <input type="text" placeholder="Enter college name">
                    <br><br>

                    <label>Degree:</label>
                    <select>
                        <option>B.E</option>
                        <option>B.Tech</option>
                        <option>B.Sc</option>
                        <option>BCA</option>
                        <option>MCA</option>
                    </select>
                    <br>

                    <label>Department:</label>
                    <input type="text" placeholder="Enter department">
                    <br><br>

                    <label>Year of Passing:</label>
                    <input type="number" placeholder="Enter passing year">

                </fieldset>

                <br>


                <fieldset>
                    <legend><b>Skills</b></legend>

                    <input type="checkbox"> HTML
                    <input type="checkbox"> CSS
                    <input type="checkbox"> JavaScript
                    <input type="checkbox"> Python
                    <input type="checkbox"> Java
                    <br><br>

                    <label>Other Skills:</label><br>
                    <textarea rows="3" cols="40" placeholder="Enter other skills"></textarea>

                </fieldset>

                <br>


                <fieldset>
                    <legend><b>Experience</b></legend>

                    <label>Experience Level:</label>

                    <select>
                        <option>Fresher</option>
                        <option>1 Year</option>
                        <option>2 Years</option>
                        <option>3+ Years</option>
                    </select>

                    <br><br>

                    <label>Work Experience:</label><br>
                    <textarea rows="5" cols="50" placeholder="Describe your work experience"></textarea>

                </fieldset>

                <br>

                    <label>Upload Resume File:</label>
                    <input type="file">
                    <br>
                </fieldset>

                <br>

                    <input type="submit" value="Create Resume">
                    <input type="reset" value="Clear Form">

            </form>
        </section>
    </div>


</body>

</html>
