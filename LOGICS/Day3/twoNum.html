<script>
    const twoSumAdd=(nums,target)=>{
        let arr=[]
      
          for(let i=0;i<nums.length-1;i++){
            for(let j=i+1;j<nums.length;j++){
                if((nums[i]+nums[j])==target){
                    arr[0]=i
                    arr[1]=j
                }
            }
          }
          console.log(arr);   
    }
    twoSumAdd( [3,2,4],6)
</script>
