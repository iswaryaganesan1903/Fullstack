<script>
    const equalArray=(array1,array2)=>{
        let eql=true
        for(let i=0;i<array1.length;i++){
            if(array1[i]!=array2[i]){
                 eql=false
                 break
            }
        }
        if(eql){
           console.log(`Two Arrays are Equal `);  
        }
        else{
             console.log(`Two Arrays are not Equal `);
        }
    }
    equalArray( [10,20,30,40], [10,20,30,40])
</script>
