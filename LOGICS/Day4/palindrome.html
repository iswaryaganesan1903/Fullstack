<script>
    //converting number into string then reverse the string and then check
    const palindromeCheck=(input)=>{
        const str=String(input)
        let reverse=""
        for(let i=str.length-1;i>=0;i--){
            reverse +=str[i]
        }
        if(reverse===str){
            console.log(true);
        }
        else{
            console.log(false);  
        }
    }
    palindromeCheck(-121)

    //Mathematically reverse a number then check

    const palindromeNum =(num)=>{
        let original = num;
        let reverse=0
        while(num>0){
            let reminder=num%10
            reverse=reverse*10+reminder
            num=Math.floor(num/10)
        }
        if(original===reverse){
             console.log(true);
        }
        else{
            console.log(false);  
        }
        
    }
    palindromeNum(121)
</script>
